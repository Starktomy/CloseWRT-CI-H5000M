# 定时自动编译：Auto-Clean 清理完成后自动构建设备固件
name: MTK-AUTO

on:
  # Auto-Clean 完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      TEST:
        description: '仅检查五套插件与配置，不编译固件'
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # H5000M：Next / 传统版 / Modem Pro / MT5700 / MT5700M
          # 五套方案统一使用 H5000M 对应的厂商 Wi-Fi 7 SDK 分支。
          - CONFIG: H5000M-qmodem-next
            SOURCE: chasey-dev/immortalwrt-mt798x-rebase
            BRANCH: 25.12-dev-wifi7
          - CONFIG: H5000M-qmodem
            SOURCE: chasey-dev/immortalwrt-mt798x-rebase
            BRANCH: 25.12-dev-wifi7
          - CONFIG: H5000M-modem-pro
            SOURCE: chasey-dev/immortalwrt-mt798x-rebase
            BRANCH: 25.12-dev-wifi7
          - CONFIG: H5000M-mt5700
            SOURCE: chasey-dev/immortalwrt-mt798x-rebase
            BRANCH: 25.12-dev-wifi7
          - CONFIG: H5000M-mt5700m
            SOURCE: chasey-dev/immortalwrt-mt798x-rebase
            BRANCH: 25.12-dev-wifi7

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ toJSON(inputs.TEST || false) }}
