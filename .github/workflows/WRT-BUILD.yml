# 单套手动构建；五套批量构建使用 MTK-AUTO。
name: WRT-BUILD

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: H5000M-qmodem-next
        required: true
        type: choice
        options:
          - H5000M-qmodem-next
          - H5000M-qmodem
          - H5000M-modem-pro
          - H5000M-mt5700
          - H5000M-mt5700m
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string
      TEST:
        description: '仅检查插件与配置，不编译固件'
        default: false
        required: true
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ inputs.CONFIG }}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ inputs.CONFIG }}
      WRT_REPO: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
      WRT_BRANCH: 25.12-dev-wifi7
      WRT_SOURCE: chasey-dev/immortalwrt-mt798x-rebase
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ toJSON(inputs.TEST) }}
